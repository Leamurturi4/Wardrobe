        "operationId": "uploadClosetImage",
        "tags": [
          "closet"
        ],
        "description": "Store a PNG, JPEG or WebP up to 5 MB; no AI analysis. Send raw image bytes.",
        "requestBody": {
          "required": true,
          "content": {
            "image/png": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/jpeg": {
              "schema": {
                "type": "string",
                "format": "binary"
