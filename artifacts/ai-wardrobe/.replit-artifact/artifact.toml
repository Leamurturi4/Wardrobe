kind = "web"
previewPath = "/"
title = "AI Wardrobe"
version = "1.0.0"
id = "artifacts/ai-wardrobe"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18363

[services.development]
run = "pnpm --filter @workspace/ai-wardrobe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-wardrobe", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-wardrobe/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18363"
BASE_PATH = "/"
